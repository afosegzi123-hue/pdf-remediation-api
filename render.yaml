services:
  - type: web
    name: pdf-remediation-api
    env: docker
    dockerContext: .
    dockerfilePath: ./PdfRemediation.Api/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
